    <!--
      Speculation Rules: браузер заранее загружает страницы, на которые вот-вот перейдут (наведение, нажатие).
      Для SPA это полные переходы (ссылки извне, новая вкладка не в счёт); переходы внутри сайта
      ускоряет предзагрузка кода и данных при наведении (src/lib/prefetch.ts).
      Служебные адреса не трогаем: вход, выход, оплата, API.
    -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": ["/api/*", "/auth/*", "/login*", "/purchase/*", "/admin/*", "/rss/*", "/crawler-api/*", "/analytics-api/*"] } },
                { "not": { "selector_matches": "[rel~=nofollow], [target=_blank]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
