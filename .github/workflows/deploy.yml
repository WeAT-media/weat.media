# Деплой узла: собрать образы на раннерах GitHub, опубликовать в GHCR, обновить узел по SSH.
# Секреты узла (.env, .env.pds) собираются здесь из секретов GitHub и кладутся на узел с правами 600.
#
# Уровни (секрет окружения перекрывает одноимённый секрет репозитория):
#   репозиторий — общее для всех узлов
#     secrets  ACME_DNS_USERNAME, ACME_DNS_PASSWORD, ACME_DNS_SUBDOMAIN   одна учётка acme-dns на оба контура
#              LAVA_API_KEY, LAVA_OFFER_ID, LAVA_WEBHOOK_SECRET          оплата (пока не задано)
#              YANDEX_CLIENT_ID/SECRET, GOOGLE_CLIENT_ID/SECRET, GH_OAUTH_CLIENT_ID/SECRET (GitHub), TELEGRAM_CLIENT_ID/SECRET
#              (Google, GitHub, Telegram — только в глобальный контур: на RU-узлы не попадают)
#     vars     ACME_EMAIL, SITE_URL, SITE_VERIFY_GOOGLE / _YANDEX / _BING
#   окружение — узел (у primary и standby одного контура секреты AppView и PDS ОДИНАКОВЫЕ, иначе после
#   переключения не расшифруются привязанные аккаунты и TOTP)
#     secrets  SSH_HOST, SSH_KEY, SSH_KNOWN_HOSTS                         доступ к узлу
#              PG_PASSWORD | DATABASE_URL (+ FEED_DATABASE_URL, ANALYTICS_DATABASE_URL для managed БД)
#              REPLICATION_PRIMARY_DSN                                    только standby
#              SECRETS_KEY, ADMIN_TOKEN, PAID_CONTENT_KEY, ANALYTICS_VISITOR_SECRET
#              PDS_JWT_SECRET, PDS_ADMIN_PASSWORD, PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX
#              PDS_EMAIL_SMTP_URL                                         почта контура (пока не задано)
#              RESTIC_REPOSITORY, RESTIC_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#     vars     CONTOUR (global|ru), NODE_ROLE (primary|standby), COMPOSE_PROFILES, SITE_DOMAINS, PDS_HOST,
#              PDS_URL, PEER_CONTOUR_URL
#
# Self-hosted runner намеренно не используется: репозиторий публичный, а раннер на проде выполнял бы чужой код.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Узел
        type: choice
        options:
          - Production (NL-1)
          - Production (RU-1)
          - Production (RU-2)

# два деплоя одного узла одновременно не идут
concurrency: deploy-${{ inputs.environment }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/weat-media/weat.media

jobs:
  images:
    name: Образы · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: appview, context: server }
          - { name: feed, context: services/feed }
          - { name: analytics, context: services/analytics }
          - { name: labeler, context: services/labeler }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Деплой · ${{ inputs.environment }}
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # edge зависит от контура (адрес PDS вшит в сборку фронта) — свой образ на контур
      - name: Образ edge (${{ vars.CONTOUR }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/node/Dockerfile.edge
          push: true
          tags: ${{ env.REGISTRY }}/edge-${{ vars.CONTOUR }}:${{ github.sha }}
          build-args: |
            VITE_SITE_NAME=weAT.media
            VITE_HANDLE_DOMAIN=weat.media
            VITE_SITE_URL=${{ vars.SITE_URL }}
            VITE_PDS_URL=${{ vars.PDS_URL }}
            VITE_SOURCE_URL=https://github.com/${{ github.repository }}
            VITE_ZITADEL_ISSUER=${{ vars.ZITADEL_ISSUER }}
            VITE_ZITADEL_CLIENT_ID=${{ vars.ZITADEL_CLIENT_ID }}
            VITE_ZITADEL_PROJECT_ID=${{ vars.ZITADEL_PROJECT_ID }}
            SITE_VERIFY_GOOGLE=${{ vars.SITE_VERIFY_GOOGLE }}
            SITE_VERIFY_YANDEX=${{ vars.SITE_VERIFY_YANDEX }}
            SITE_VERIFY_BING=${{ vars.SITE_VERIFY_BING }}
          cache-from: type=gha,scope=edge-${{ vars.CONTOUR }}
          cache-to: type=gha,mode=max,scope=edge-${{ vars.CONTOUR }}

      - name: SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy

      - name: Секреты узла
        env:
          # репозиторий
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Zitadel (deploy/auth): AppView проверяет JWT сотрудников по JWKS
          ZITADEL_ISSUER: ${{ vars.ZITADEL_ISSUER }}
          ZITADEL_PROJECT_ID: ${{ vars.ZITADEL_PROJECT_ID }}
          ACME_DNS_USERNAME: ${{ secrets.ACME_DNS_USERNAME }}
          ACME_DNS_PASSWORD: ${{ secrets.ACME_DNS_PASSWORD }}
          ACME_DNS_SUBDOMAIN: ${{ secrets.ACME_DNS_SUBDOMAIN }}
          LAVA_API_KEY: ${{ secrets.LAVA_API_KEY }}
          LAVA_OFFER_ID: ${{ secrets.LAVA_OFFER_ID }}
          LAVA_WEBHOOK_SECRET: ${{ secrets.LAVA_WEBHOOK_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # GitHub не даёт заводить секреты с префиксом GITHUB_ — в GitHub они GH_OAUTH_*, на узле — GITHUB_*
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          # окружение
          CONTOUR: ${{ vars.CONTOUR }}
          NODE_ROLE: ${{ vars.NODE_ROLE }}
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
          SITE_DOMAINS: ${{ vars.SITE_DOMAINS }}
          PDS_HOST: ${{ vars.PDS_HOST }}
          PEER_CONTOUR_URL: ${{ vars.PEER_CONTOUR_URL }}
          PEER_PDS_URLS: ${{ vars.PEER_PDS_URLS }}
          # общий секрет контуров: вход через провайдера находит аккаунт соседнего контура, а не создаёт второй
          PEER_SECRET: ${{ secrets.PEER_SECRET }}
          # краулер на отдельном VPS (deploy/crawler): edge проксирует /crawler-api/* из админки
          CRAWLER_API_URL: ${{ vars.CRAWLER_API_URL }}
          # сторож (профиль watchdog): что проверять и куда слать тревогу
          WATCH_FROM: ${{ vars.WATCH_FROM }}
          WATCH_TARGETS: ${{ vars.WATCH_TARGETS }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ALERT_TELEGRAM_CHAT: ${{ vars.ALERT_TELEGRAM_CHAT }}
          ALERT_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEED_DATABASE_URL: ${{ secrets.FEED_DATABASE_URL }}
          ANALYTICS_DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL }}
          REPLICATION_PRIMARY_DSN: ${{ secrets.REPLICATION_PRIMARY_DSN }}
          # резерв глобального контура на Supabase (Session pooler, IPv4): логическая реплика AppView
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
          # коллегии присяжных: ключи подписи (только в .env.labeler) и общий с AppView токен записи меток
          LABELER_KEYS: ${{ secrets.LABELER_KEYS }}
          LABELER_DIDS: ${{ vars.LABELER_DIDS }}
          LABELER_ADMIN_TOKEN: ${{ secrets.LABELER_ADMIN_TOKEN }}
          # узел без своих коллегий (RU) ходит к ним по публичному адресу; на узле с коллегиями — IP, которым можно
          # ставить метки через /admin (вместе с токеном LABELER_ADMIN_TOKEN)
          LABELER_URL: ${{ vars.LABELER_URL }}
          LABELER_PEER_IPS: ${{ vars.LABELER_PEER_IPS }}
          # пароль пользователя replicator: им резерв подписывается на публикацию indie_all
          REPLICATION_PASSWORD: ${{ secrets.REPLICATION_PASSWORD }}
          PG_BIND: ${{ vars.PG_BIND }}
          PG_BIND6: ${{ vars.PG_BIND6 }}
          # ящики площадки для /admin/email (пароли — из deploy/mail/passwords узла)
          MAILBOX_SUPPORT_PASSWORD: ${{ secrets.MAILBOX_SUPPORT_PASSWORD }}
          MAILBOX_LEGAL_PASSWORD: ${{ secrets.MAILBOX_LEGAL_PASSWORD }}
          MAILBOX_NOREPLY_PASSWORD: ${{ secrets.MAILBOX_NOREPLY_PASSWORD }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PAID_CONTENT_KEY: ${{ secrets.PAID_CONTENT_KEY }}
          ANALYTICS_VISITOR_SECRET: ${{ secrets.ANALYTICS_VISITOR_SECRET }}
          PDS_JWT_SECRET: ${{ secrets.PDS_JWT_SECRET }}
          PDS_ADMIN_PASSWORD: ${{ secrets.PDS_ADMIN_PASSWORD }}
          PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${{ secrets.PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX }}
          PDS_EMAIL_SMTP_URL: ${{ secrets.PDS_EMAIL_SMTP_URL }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          umask 077
          missing=""
          for k in CONTOUR NODE_ROLE SITE_DOMAINS PDS_HOST SITE_URL ACME_EMAIL ACME_DNS_USERNAME ACME_DNS_PASSWORD ACME_DNS_SUBDOMAIN \
                   SECRETS_KEY ADMIN_TOKEN PAID_CONTENT_KEY ANALYTICS_VISITOR_SECRET PDS_JWT_SECRET PDS_ADMIN_PASSWORD PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX; do
            [ -n "${!k:-}" ] || missing="$missing $k"
          done
          [ -n "${DATABASE_URL:-}${PG_PASSWORD:-}" ] || missing="$missing PG_PASSWORD|DATABASE_URL"
          if [ -n "$missing" ]; then echo "Не заданы:$missing" >&2; exit 1; fi
          # свой Postgres узла (selfhosted-db) — адреса из PG_PASSWORD; managed — заданы целиком
          pg() { printf 'postgres://indie:%s@postgres:5432/%s' "$PG_PASSWORD" "$1"; }
          # зарубежные провайдеры входа (Google, GitHub, Telegram) в РФ-контуре запрещены — их ключи туда не кладём
          if [ "$CONTOUR" = ru ]; then
            unset GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET
          fi
          DATABASE_URL=${DATABASE_URL:-$(pg indie)}
          FEED_DATABASE_URL=${FEED_DATABASE_URL:-$(pg feed)}
          ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL:-$(pg analytics)}
          # пустое — строку не пишем: необязательное остаётся «не задано»
          line() { [ -n "${!1:-}" ] && printf '%s=%s\n' "$1" "${!1}" || true; }
          {
            for k in CONTOUR NODE_ROLE COMPOSE_PROFILES SITE_DOMAINS PDS_HOST PEER_CONTOUR_URL PEER_PDS_URLS PEER_SECRET CRAWLER_API_URL WATCH_FROM WATCH_TARGETS ALERT_EMAIL ALERT_TELEGRAM_CHAT ALERT_TELEGRAM_TOKEN ACME_EMAIL ACME_DNS_USERNAME ACME_DNS_PASSWORD ACME_DNS_SUBDOMAIN \
                     PG_PASSWORD DATABASE_URL FEED_DATABASE_URL ANALYTICS_DATABASE_URL REPLICATION_PRIMARY_DSN SUPABASE_DSN REPLICATION_PASSWORD PG_BIND PG_BIND6 ZITADEL_ISSUER ZITADEL_PROJECT_ID LABELER_ADMIN_TOKEN LABELER_DIDS LABELER_PEER_IPS MAILBOX_SUPPORT_PASSWORD MAILBOX_LEGAL_PASSWORD MAILBOX_NOREPLY_PASSWORD \
                     SECRETS_KEY ADMIN_TOKEN PAID_CONTENT_KEY PDS_ADMIN_PASSWORD ANALYTICS_VISITOR_SECRET \
                     LAVA_API_KEY LAVA_OFFER_ID LAVA_WEBHOOK_SECRET YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET RESTIC_REPOSITORY RESTIC_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
              line "$k"
            done
            printf 'PUBLIC_URL=%s\nCORS_ORIGIN=%s\nPDS_HANDLE_DOMAIN=weat.media\nACME_DNS_SERVER=https://auth.acme-dns.io\nGEOIP_DB_PATH=/geoip/country.mmdb\nADMIN_ALLOW_IPS=127.0.0.1/32\nBACKUP_INTERVAL_SEC=300\n' "$SITE_URL" "$SITE_URL"
            [ "$CONTOUR" = ru ] && echo MAIL_HOST=mail-ru.weat.media || echo MAIL_HOST=mail.weat.media
            # AppView ходит к коллегиям внутри узла, если они здесь; ключей подписи в .env нет
            if [ -n "${LABELER_KEYS:-}" ]; then echo LABELER_URL=http://labeler:8791; else line LABELER_URL; fi
          } > node.env
          {
            printf 'PDS_HOSTNAME=%s\nPDS_SERVICE_HANDLE_DOMAINS=.weat.media\n' "$PDS_HOST"
            for k in PDS_JWT_SECRET PDS_ADMIN_PASSWORD PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX; do line "$k"; done
            printf 'PDS_DID_PLC_URL=https://plc.directory\nPDS_BSKY_APP_VIEW_URL=https://api.bsky.app\nPDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app\n'
            printf 'PDS_REPORT_SERVICE_URL=https://mod.bsky.app\nPDS_REPORT_SERVICE_DID=did:plc:ar7c4by46qjdydhdevvrndac\nPDS_CRAWLERS=https://bsky.network\n'
            # PDS требует адрес отправителя и SMTP вместе — без почты не пишем ни то, ни другое
            if [ -n "${PDS_EMAIL_SMTP_URL:-}" ]; then printf 'PDS_EMAIL_SMTP_URL=%s\nPDS_EMAIL_FROM_ADDRESS=noreply@weat.media\n' "$PDS_EMAIL_SMTP_URL"; fi
          } > node.env.pds
          {
            line LABELER_KEYS; line LABELER_ADMIN_TOKEN
            [ -n "${PG_PASSWORD:-}" ] && printf 'DATABASE_URL=postgres://indie:%s@postgres:5432/labeler\n' "$PG_PASSWORD" || true
          } > node.env.labeler
          # на узел — во временные файлы, затем атомарная замена; на раннере не оставляем
          scp -q -i ~/.ssh/deploy -o BatchMode=yes node.env "root@$HOST:/opt/weat/deploy/node/.env.new"
          scp -q -i ~/.ssh/deploy -o BatchMode=yes node.env.pds "root@$HOST:/opt/weat/deploy/node/.env.pds.new"
          scp -q -i ~/.ssh/deploy -o BatchMode=yes node.env.labeler "root@$HOST:/opt/weat/deploy/node/.env.labeler.new"
          rm -f node.env node.env.pds node.env.labeler
          # .env.override на узле (пишет failover.yml: роль после переключения) перекрывает переменные GitHub
          ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST" 'cd /opt/weat/deploy/node && chmod 600 .env.new .env.pds.new .env.labeler.new && mv .env.new .env && if [ -s .env.override ]; then awk -F= "NR==FNR{o[\$1]=1;next} !(\$1 in o)" .env.override .env > .env.tmp; cat .env.override >> .env.tmp; chmod 600 .env.tmp; mv .env.tmp .env; fi && mv .env.pds.new .env.pds && mv .env.labeler.new .env.labeler'

      - name: Обновить узел
        env:
          HOST: ${{ secrets.SSH_HOST }}
          SHA: ${{ github.sha }}
          EDGE: ${{ env.REGISTRY }}/edge-${{ vars.CONTOUR }}:${{ github.sha }}
          APPVIEW: ${{ env.REGISTRY }}/appview:${{ github.sha }}
          FEED: ${{ env.REGISTRY }}/feed:${{ github.sha }}
          ANALYTICS: ${{ env.REGISTRY }}/analytics:${{ github.sha }}
          LABELER: ${{ env.REGISTRY }}/labeler:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # токен GHCR живёт, пока идёт джоб; на узле не остаётся (docker logout в конце)
          ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST" \
            SHA="$SHA" EDGE="$EDGE" APPVIEW="$APPVIEW" FEED="$FEED" ANALYTICS="$ANALYTICS" LABELER="$LABELER" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/weat
          git fetch --quiet origin
          git checkout --quiet --force "$SHA"
          cd deploy/node
          # TLS Postgres: самоподписанный, один раз на узел (подписчик проверяет sslmode=require)
          if [ ! -s pg-tls/server.key ]; then
            install -d -m 700 pg-tls
            openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=$(hostname)" \
              -keyout pg-tls/server.key -out pg-tls/server.crt 2>/dev/null
          fi
          chown -R 70:70 pg-tls && chmod 600 pg-tls/server.key && chmod 644 pg-tls/server.crt
          printf 'EDGE_IMAGE=%s\nAPPVIEW_IMAGE=%s\nFEED_IMAGE=%s\nANALYTICS_IMAGE=%s\nLABELER_IMAGE=%s\n' "$EDGE" "$APPVIEW" "$FEED" "$ANALYTICS" "$LABELER" > .env.images
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          compose() { docker compose --env-file .env --env-file .env.images "$@"; }
          compose pull --quiet edge appview feed analytics
          # коллегии — только где включён профиль labeler; база создаётся при первом включении
          if grep -q '^COMPOSE_PROFILES=.*labeler' .env; then
            compose pull --quiet labeler
            if compose ps --services --status running | grep -qx postgres; then
              # </dev/null: иначе exec съест остаток этого скрипта со stdin (bash -s) и up не выполнится
              compose exec -T postgres psql -U indie -d indie -tAc "SELECT 1 FROM pg_database WHERE datname='labeler'" </dev/null | grep -q 1 \
                || compose exec -T postgres psql -U indie -d indie -qc 'CREATE DATABASE labeler OWNER indie' </dev/null
            fi
          fi
          # резерв на Supabase (логическая реплика): DDL не реплицируется — миграции туда до перезапуска AppView,
          # иначе первая же строка новой таблицы/колонки роняет подписку в цикл переподключений
          SUPA=$(grep '^SUPABASE_DSN=' .env | cut -d= -f2- || true)
          if [ -n "$SUPA" ]; then
            docker run --rm -e DATABASE_URL="$SUPA" --entrypoint node "$APPVIEW" --input-type=module -e '
              const { createDb } = await import("/app/dist/db.js"); const { migrate } = await import("/app/dist/migrate.js")
              const sql = createDb(process.env.DATABASE_URL); await migrate(sql, { standby: true }); await sql.end()' </dev/null 2>&1 \
              | sed -E 's#postgres(ql)?://[^ ]*#<dsn>#g' | tail -5 || echo "::warning::Supabase: миграции не применились"
            # новые таблицы — сразу закрыты от REST API Supabase (RLS + без прав anon/authenticated)
            docker run --rm -i postgres:17-alpine psql "$SUPA" -X -q -At -v ON_ERROR_STOP=1 < ../db/supabase-lockdown.sql 2>&1 \
              | sed -E 's#postgres(ql)?://[^ ]*#<dsn>#g' || echo "::warning::Supabase: блокировка public не применилась"
          fi
          compose up -d --remove-orphans
          docker image prune -f >/dev/null
          if [ -n "$SUPA" ]; then
            # новые таблицы публикации — в подписку (с копированием данных)
            docker run --rm -e D="$SUPA" postgres:17-alpine psql "$SUPA" -X -q -c 'ALTER SUBSCRIPTION weat_nl1 REFRESH PUBLICATION WITH (copy_data = true)' </dev/null 2>&1 \
              | sed -E 's#postgres(ql)?://[^ ]*#<dsn>#g' || echo "::warning::Supabase: подписка не обновилась"
          fi
          # пользователь репликации и публикация всех таблиц — если узел держит свой Postgres и пароль задан
          if grep -q '^REPLICATION_PASSWORD=' .env && compose ps --services --status running | grep -qx postgres; then
            sleep 3
            compose exec -T postgres psql -U indie -d indie -X -q -v ON_ERROR_STOP=1 \
              -v pw="$(grep '^REPLICATION_PASSWORD=' .env | cut -d= -f2-)" <<'SQL'
          SELECT format('CREATE ROLE replicator LOGIN REPLICATION PASSWORD %L', :'pw')
            WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'replicator') \gexec
          SELECT format('ALTER ROLE replicator LOGIN REPLICATION PASSWORD %L', :'pw') \gexec
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO replicator;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO replicator;
          SELECT 'CREATE PUBLICATION indie_all FOR ALL TABLES'
            WHERE NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'indie_all') \gexec
          SQL
          fi
          compose ps --format '{{.Service}}: {{.Status}}'
          REMOTE

      - name: Проверка
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          # AppView изнутри узла: DNS и сертификат могут ещё не быть готовы, а сервис — уже должен
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST" \
              'cd /opt/weat/deploy/node && docker compose --env-file .env --env-file .env.images exec -T appview wget -qO- http://127.0.0.1:8787/api/health' ; then
              exit 0
            fi
            sleep 6
          done
          echo "AppView не ответил на /api/health" >&2
          exit 1
