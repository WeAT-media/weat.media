[package]
name = "weat-analytics"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Открытая аналитика статей: приём событий и агрегаты по дням"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
